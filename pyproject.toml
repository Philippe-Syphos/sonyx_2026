[project]
name = "sonyx"
version = "0.1.0"
description = "Picasso layout targeting the luqia_ln200 PDK."
requires-python = ">=3.13"
dependencies = [
    "picasso",
    "luqia_ln200",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "ty>=0.0.14",
]

# Both sources are pinned to the sonyx-2026-v0.1 snapshot tags so that a
# fresh clone of this repo at v0.1.0 reproduces the preliminary
# submission: `uv run python -m sonyx.artifacts` resolves the exact PDK
# and framework commits the layout was built with. No machine-local
# paths.
[tool.uv.sources]
luqia_ln200 = { git = "https://github.com/SyphosPhotonics/pdk-luqia-ln200.git", tag = "sonyx-2026-v0.1" }
picasso = { git = "https://github.com/SyphosPhotonics/picasso.git", tag = "sonyx-2026-v0.1" }
