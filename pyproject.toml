[project]
name = "sonyx"
version = "0.1.0"
description = "Picasso layout targeting the luqia_ln200 PDK."
requires-python = ">=3.13"
dependencies = [
    "picasso",
    "luqia_ln200",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "ty>=0.0.14",
]

# Editable local paths for active development: `uv run` builds against
# the PDK and framework working trees (sibling checkouts). For a tapeout
# freeze, switch back to the pinned snapshot tags so a fresh clone
# reproduces the submission, e.g.:
# luqia_ln200 = { git = "https://github.com/SyphosPhotonics/pdk-luqia-ln200.git", tag = "sonyx-2026-v0.1" }
# picasso = { git = "https://github.com/SyphosPhotonics/picasso.git", tag = "sonyx-2026-v0.1" }
[tool.uv.sources]
luqia_ln200 = { path = "../pdk-luqia-ln200", editable = true }
picasso = { path = "../picasso", editable = true }
